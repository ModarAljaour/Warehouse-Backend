services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    secrets:
      - influx-admin-token
    ports:
      - "8000:8000"
    depends_on:
      - emqx
      - influxdb
    networks:
      - warehouse-net

  emqx:
    image: emqx/emqx:5.8.8
    container_name: warehouse-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - warehouse-net

  influxdb:
    image: influxdb:3.11.2-core
    container_name: warehouse-influxdb
    restart: unless-stopped
    command:
      - influxdb3
      - serve
      - --node-id=warehouse-node
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/run/secrets/influx-admin-token
    secrets:
      - influx-admin-token
    volumes:
      - influx-data:/var/lib/influxdb3/data
    networks:
      - warehouse-net

networks:
  warehouse-net:

volumes:
  emqx-data:
  emqx-log:
  influx-data:

secrets:
  influx-admin-token:
    file: ./secrets/influx-admin-token.json
