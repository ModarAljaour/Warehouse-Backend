services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    secrets:
      - influx-admin-token
    ports:
      - "8000:8000"
    depends_on:
      - emqx
      - influxdb
    networks:
      - warehouse-net

  emqx:
    image: emqx/emqx:5.8.8
    container_name: warehouse-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - warehouse-net

  influxdb:
    image: influxdb:2.9.1
    container_name: warehouse-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME_FILE: /run/secrets/influx-admin-username
      DOCKER_INFLUXDB_INIT_PASSWORD_FILE: /run/secrets/influx-admin-password
      DOCKER_INFLUXDB_INIT_ORG: warehouse
      DOCKER_INFLUXDB_INIT_BUCKET: warehouse
      DOCKER_INFLUXDB_INIT_RETENTION: 2160h
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE: /run/secrets/influx-admin-token
    secrets:
      - influx-admin-token
      - influx-admin-username
      - influx-admin-password
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    networks:
      - warehouse-net

networks:
  warehouse-net:

volumes:
  emqx-data:
  emqx-log:
  influx-data:
  influx-config:

secrets:
  influx-admin-token:
    file: ./secrets/influx-admin-token.txt
  influx-admin-username:
    file: ./secrets/influx-admin-username.txt
  influx-admin-password:
    file: ./secrets/influx-admin-password.txt
